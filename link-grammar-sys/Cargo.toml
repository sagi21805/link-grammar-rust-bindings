[package]
name = "link-grammar-sys"
description = "Raw FFI bindings to the link-grammar C library"
links = "link-grammar"
build = "build/main.rs"
readme = "README.md"
categories = ["external-ffi-bindings", "text-processing"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
include = [
    "/README.md",
    "/build/**",
    "/src/**",
    "/generated/**",
    "/link-grammar/LICENSE",
    "/link-grammar/configure.ac",
    "/link-grammar/link-grammar/**/*.c",
    "/link-grammar/link-grammar/**/*.h",
    "/link-grammar/link-grammar/link-features.h.in",
    "!/link-grammar/link-grammar/minisat/**",
    "!/link-grammar/link-grammar/malloc-dbg*.c",
    "/link-grammar/data/en/**",
]

[dependencies]
libc = "0.2"

[build-dependencies]
cc = "1"
