name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustfmt.toml uses options that only nightly rustfmt has.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo +nightly fmt --all --check

  bundled:
    strategy:
      matrix:
        # Step 8 of the plan adds windows-latest.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo xtask package-check

  system:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y liblink-grammar-dev pkg-config
      - if: runner.os == 'macOS'
        run: brew install link-grammar pkgconf
      - run: pkg-config --modversion link-grammar
      # The distribution's link-grammar may be older than the submodule,
      # so its dictionary can find a different number of linkages than
      # the tests expect. Build and parse one sentence instead.
      - run: cargo build -p link-grammar --no-default-features --example parse
      - run: echo "The lander touched down on Mars." | cargo run -p link-grammar --no-default-features --example parse
